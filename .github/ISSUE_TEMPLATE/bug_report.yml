name: Bug report
description: Report a reproducible problem with Overseer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include tokens, API keys, or other secrets.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clearly describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Use ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Overseer version
      placeholder: "3.0.0"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
